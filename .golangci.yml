version: "2"

linters:
  default: standard
  enable:
    - bodyclose
    - errorlint
    - gosec
    - misspell
    - modernize
    - nolintlint
    - recvcheck
    - sloglint
    - thelper
    - unconvert
    - usetesting
  settings:
    thelper:
      # internal/testenv names its testing.TB parameter t.
      tb:
        name: false
    usetesting:
      context-background: true
      context-todo: true
  exclusions:
    rules:
      # Tests close test servers and bodies without checking errors, launch
      # the binary under test and read fixture paths; these rules only add
      # noise there. Production code keeps them all.
      - path: _test\.go
        linters: [errcheck, gosec, bodyclose]
      # Load-test tools call the URLs and write the shared files they are
      # configured with; that is their job, not request forgery or traversal.
      - path: ^loadtest/
        text: G70[34]
        linters: [gosec]

formatters:
  enable:
    - gofmt
    - goimports
