# Local development infrastructure. Tests do not use this; they start their own
# containers through testcontainers so they never touch shared state.
services:
  valkey:
    image: valkey/valkey:9.1.2-alpine
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 2s
      timeout: 2s
      retries: 15

  postgres:
    image: postgres:18.6
    environment:
      POSTGRES_USER: edge
      POSTGRES_PASSWORD: edge-local-dev
      POSTGRES_DB: edge_admin
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U edge -d edge_admin"]
      interval: 2s
      timeout: 2s
      retries: 15
