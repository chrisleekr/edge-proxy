name: Release Please

# release-please keeps a Release PR open on main. Merging it tags v<x.y.z>,
# writes CHANGELOG.md and creates the GitHub release; the images are then
# built from that tag and pushed.
on:
  push:
    branches: [main]

concurrency:
  group: release-please-${{ github.ref }}
  cancel-in-progress: false

permissions: {}

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      pull-requests: write
      issues: write
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      # RELEASE_TOKEN (a PAT) rather than GITHUB_TOKEN: PRs opened with
      # GITHUB_TOKEN don't trigger workflows, so CI would never run on the
      # Release PR.
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        id: release
        with:
          token: ${{ secrets.RELEASE_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  publish:
    needs: release
    if: needs.release.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    # Only what the build needs: no write scopes from the release job.
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.release.outputs.tag_name }}
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
      - run: ./scripts/ci/publish.sh chrisleekr/edge-proxy "$TAG" latest
        env:
          TAG: ${{ needs.release.outputs.tag_name }}

  notify-helm-charts:
    # After publish: the chart PR points appVersion at the image tag, so it must
    # not open until every image is pushed.
    needs: [release, publish]
    if: needs.release.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # The cross-repo dispatch uses RELEASE_TOKEN, so GITHUB_TOKEN needs nothing.
    permissions: {}
    steps:
      # Wakes helm-charts' edge-proxy-sync workflow, which opens the chart bump
      # PR. It only runs if that workflow is on helm-charts' default branch, and
      # the POST returns 204 even when nothing listens.
      - env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN }}
          TAG: ${{ needs.release.outputs.tag_name }}
        run: |
          gh api -X POST repos/chrisleekr/helm-charts/dispatches \
            -f event_type=edge-proxy-released \
            -f "client_payload[version]=${TAG#v}"
